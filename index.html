<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A1 Bites | Menu</title>
<meta name="description" content="A1 Bites menu with prices: broasted chicken, shawarma, wraps, burgers, fish, fries and combos.">
<meta name="theme-color" content="#FAF3E9">
<meta property="og:title" content="A1 Bites | Menu">
<meta property="og:description" content="Good Food • Good Mood. See the full menu and prices.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Kaushan+Script&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    --red: #EE1120;
    --red-dark: #C40A18;
    --yellow: #F9C824;
    --cream: #FAF3E9;
    --paper: #FFFEFB;
    --ink: #170E0E;
    --muted: #7B6B64;
    --line: #EBDCC3;
    --veg: #1E8E3E;
    --nonveg: #EE1120;
    --head: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
    --brush: "Kaushan Script", "Baloo 2", cursive, sans-serif;
    --body: "DM Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; scroll-padding-top: 124px; -webkit-text-size-adjust: 100%; }
  body { font-family: var(--body); background: var(--cream); color: var(--ink); line-height: 1.45; -webkit-tap-highlight-color: transparent; }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  a { color: inherit; }
  :focus-visible { outline: 3px solid var(--red); outline-offset: 2px; }
  [hidden] { display: none !important; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 0 16px; }


  /* ---------- Store card ---------- */
  .store { background: var(--paper); border-bottom: 1px solid var(--line); padding: max(18px, env(safe-area-inset-top, 0px)) 0 16px; text-align: center; }
  .logo { display: block; width: 150px; height: 150px; margin: 0 auto 8px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .store h1 { font: 800 26px/1.1 var(--head); }
  .store .addr { color: var(--muted); font-size: 14px; margin-top: 4px; display: flex; gap: 8px; align-items: flex-start; justify-content: center; text-align: left; }
  .store .addr svg { flex: none; margin-top: 2px; color: var(--red); }
  .chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 12px; font-size: 13px; font-weight: 600; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 999px; background: var(--cream); border: 1px solid var(--line); }
  .chip.open { background: #E6F5EA; border-color: #BFE3C9; color: #17692F; }
  .store-actions { display: flex; gap: 8px; margin-top: 14px; }
  .btn { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; gap: 6px; height: 44px; padding: 0 6px; border-radius: 12px; font-weight: 700; font-size: 14px; white-space: nowrap; text-decoration: none; border: 2px solid var(--red); color: var(--red); background: #fff; }
  .btn svg { flex: none; }
  .btn.solid { background: var(--red); color: #fff; }
  .btn.wa { background: #1FA855; border-color: #1FA855; color: #fff; }

  .offer { background: var(--yellow); padding: 10px 0; font-size: 14px; font-weight: 600; border-bottom: 2px solid var(--red); }
  .offer .wrap { display: flex; gap: 10px; align-items: center; }
  .offer b { font: 800 17px var(--head); color: var(--red-dark); }

  /* ---------- Sticky nav ---------- */
  .nav { position: sticky; top: 0; z-index: 20; background: var(--cream); padding-top: env(safe-area-inset-top, 0px); border-bottom: 1px solid var(--line); box-shadow: 0 2px 6px rgba(0,0,0,.06); transform: translateZ(0); }
  .tools { display: flex; gap: 8px; padding: 10px 0 8px; }
  .search { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; background: #fff; border: 1.5px solid var(--line); border-radius: 999px; padding: 0 14px; color: var(--muted); }
  .search:focus-within { border-color: var(--red); box-shadow: 0 0 0 3px rgba(238,17,32,.18); }
  .search input { width: 100%; background: transparent; border: 0; outline: 0; height: 38px; font-size: 15px; color: var(--ink); }
  .veg-toggle { flex: none; height: 38px; padding: 0 14px; border-radius: 999px; background: #fff; border: 1.5px solid var(--veg); color: var(--veg); font-weight: 700; font-size: 14px; display: flex; align-items: center; gap: 7px; }
  .veg-toggle[aria-pressed="true"] { background: var(--veg); color: #fff; }
  .dot { width: 12px; height: 12px; border: 1.5px solid currentColor; border-radius: 2px; display: grid; place-items: center; }
  .dot::after { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .pills { position: relative; display: flex; gap: 6px; overflow-x: auto; padding: 0 16px 10px; scrollbar-width: none; }
  .pills::-webkit-scrollbar { display: none; }
  .pill { flex: none; padding: 7px 14px; border-radius: 999px; background: transparent; border: 1.5px solid transparent; color: var(--red-dark); font-weight: 700; font-size: 14px; white-space: nowrap; }
  .pill[aria-current="true"] { background: var(--red); color: #fff; }

  /* ---------- Menu ---------- */
  main { padding-top: 20px; padding-bottom: 8px; }
  .cat { margin-bottom: 28px; content-visibility: auto; contain-intrinsic-size: auto 600px; }
  .cat h2 { font: 400 28px/1.1 var(--brush); color: var(--red); margin-bottom: 12px; display: flex; align-items: baseline; gap: 10px; }
  .cat h2 span { font: 600 13px var(--body); color: var(--muted); }
  .list { display: grid; gap: 10px; }
  .card { display: flex; gap: 12px; justify-content: space-between; align-items: center; background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
  .info { flex: 1; min-width: 0; padding-left: 2px; }
  .titleline { display: flex; gap: 8px; align-items: flex-start; }
  .mark { flex: none; width: 14px; height: 14px; margin-top: 4px; border: 1.5px solid; border-radius: 2px; display: grid; place-items: center; }
  .mark::after { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .mark.veg { color: var(--veg); }
  .mark.non { color: var(--nonveg); }
  .name { font-weight: 700; font-size: 16px; line-height: 1.3; }
  .price { flex: none; font: 800 18px/1 var(--head); background: var(--yellow); padding: 6px 10px 5px; border-radius: 8px; }
  .badge { display: inline-block; margin: 0 0 0 8px; font-size: 12px; font-weight: 700; background: var(--red); color: #fff; padding: 2px 9px; border-radius: 6px; vertical-align: 2px; }
  .note { font-size: 13px; color: var(--muted); margin: 4px 0 0 22px; }
  .empty { text-align: center; color: var(--muted); padding: 40px 0; }

  /* ---------- Find us ---------- */
  .visit { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 18px 16px; margin: 8px 0 20px; }
  .visit h2 { font: 400 26px/1.1 var(--brush); color: var(--red); margin-bottom: 10px; }
  .row { display: flex; gap: 12px; padding: 8px 0; align-items: flex-start; }
  .row svg { flex: none; margin-top: 2px; color: var(--red); }
  .row small { display: block; color: var(--muted); font-size: 12px; font-weight: 600; }
  .row a { text-decoration: none; font-weight: 600; }
  footer { text-align: center; color: var(--muted); font-size: 12px; padding: 4px 0 28px; }
  footer strong { display: block; color: var(--red); font: 400 22px var(--brush); margin-bottom: 2px; }

  @media (max-width: 380px) { .btn { font-size: 13px; gap: 4px; } .btn svg { width: 16px; height: 16px; } }

  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
</style>
</head>

/* ------------------------- code ------------------------- */
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const slug = (s) => s.toLowerCase().replace(/[^a-z0-9]+/g, '-');
const rupee = (n) => "₹" + n.toLocaleString("en-IN");

let query = "", vegOnly = false;

function renderMenu() {
  const q = query.trim().toLowerCase();
  let total = 0;
  $("#menu").innerHTML = MENU.map(cat => {
    const items = cat.items.filter(i =>
      (!vegOnly || i.veg) &&
      (!q || (i.n + " " + (i.note || "") + " " + cat.name).toLowerCase().includes(q)));
    total += items.length;
    if (!items.length) return "";
    return `<section class="cat" id="${slug(cat.name)}" data-cat="${slug(cat.name)}">
      <h2>${esc(cat.name)} <span>${items.length} ${items.length === 1 ? "item" : "items"}</span></h2>
      <div class="list">${items.map(i => `
        <article class="card">
          <div class="info">
            <div class="titleline">
              <span class="mark ${i.veg ? 'veg' : 'non'}" role="img" aria-label="${i.veg ? 'Vegetarian' : 'Non-vegetarian'}"></span>
              <h3 class="name">${esc(i.n)}${i.badge ? `<span class="badge">${esc(i.badge)}</span>` : ""}</h3>
            </div>
            ${i.note ? `<p class="note">${esc(i.note)}</p>` : ""}
          </div>
          <div class="price">${rupee(i.p)}</div>
        </article>`).join("")}
      </div>
    </section>`;
  }).join("");
  $("#empty").hidden = total > 0;
  renderPills();
  observe();
}

function renderPills() {
  currentCat = null;
  const visible = [...document.querySelectorAll(".cat")].map(c => c.dataset.cat);
  $("#pills").innerHTML = MENU.filter(c => visible.includes(slug(c.name)))
    .map(c => `<button class="pill" data-target="${slug(c.name)}">${esc(c.name)}</button>`).join("");
}
$("#pills").addEventListener("click", (e) => {
  const b = e.target.closest(".pill"); if (!b) return;
  document.getElementById(b.dataset.target)?.scrollIntoView();
});

let io;
function observe() {
  if (io) io.disconnect();
  io = new IntersectionObserver((entries) => {
    entries.forEach(en => { if (en.isIntersecting) setActive(en.target.dataset.cat); });
  }, { rootMargin: "-140px 0px -65% 0px" });
  document.querySelectorAll(".cat").forEach(c => io.observe(c));
}
let currentCat = null;
function setActive(id) {
  if (id === currentCat) return;           // do nothing if the section didn't change
  currentCat = id;
  const bar = $("#pills");
  document.querySelectorAll(".pill").forEach(p => {
    const on = p.dataset.target === id;
    if (on) {
      p.setAttribute("aria-current", "true");
      // move only the tab strip sideways, instantly (never scroll the page itself)
      bar.scrollLeft = p.offsetLeft - (bar.clientWidth - p.offsetWidth) / 2;
    } else p.removeAttribute("aria-current");
  });
}
$("#q").addEventListener("input", (e) => { query = e.target.value; renderMenu(); });
$("#veg").addEventListener("click", (e) => {
  vegOnly = !vegOnly; e.currentTarget.setAttribute("aria-pressed", vegOnly); renderMenu();
});

  clock: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>'

const tel = (n) => "tel:+91" + n.replace(/\D/g, "").slice(-10);

function renderStore() {
  const mapsLink = CONFIG.mapsUrl ||
    (CONFIG.address ? "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(CONFIG.name + " " + CONFIG.address) : "");
  $("#storeName").textContent = CONFIG.name;
  $("#storeAddr").innerHTML = CONFIG.address ? icon.pin + `<span>${esc(CONFIG.address)}</span>` : "";
  $("#storeAddr").hidden = !CONFIG.address;

  const chips = [];
  if (CONFIG.hours) chips.push(`<span class="chip open">${icon.clock}${esc(CONFIG.hours)}</span>`);
  if (CONFIG.openingNote) chips.push(`<span class="chip">${esc(CONFIG.openingNote)}</span>`);
  $("#storeChips").innerHTML = chips.join(""); $("#storeChips").hidden = !chips.length;

  const acts = [`<a class="btn" href="${tel(CONFIG.phones[0])}">${icon.phone}Call</a>`];
  if (CONFIG.whatsappNumber) acts.push(`<a class="btn wa" href="https://wa.me/${CONFIG.whatsappNumber}" target="_blank" rel="noopener">${icon.wa}WhatsApp</a>`);
  if (mapsLink) acts.push(`<a class="btn solid" href="${esc(mapsLink)}" target="_blank" rel="noopener">${icon.pin}Directions</a>`);
  $("#storeActions").innerHTML = acts.join("");

  const rows = [];
  if (CONFIG.address) rows.push(`<div class="row">${icon.pin}<div><small>Address</small>${mapsLink ? `<a href="${esc(mapsLink)}" target="_blank" rel="noopener">${esc(CONFIG.address)}</a>` : esc(CONFIG.address)}</div></div>`);
  if (!CONFIG.address && mapsLink) rows.push(`<div class="row">${icon.pin}<div><small>Location</small><a href="${esc(mapsLink)}" target="_blank" rel="noopener">Open in Google Maps</a></div></div>`);
  if (CONFIG.hours) rows.push(`<div class="row">${icon.clock}<div><small>Open</small>${esc(CONFIG.hours)}</div></div>`);
  rows.push(`<div class="row">${icon.phone}<div><small>Call us</small>${CONFIG.phones.map(p => `<a href="${tel(p)}">${esc(p)}</a>`).join(" &nbsp;|&nbsp; ")}</div></div>`);
  $("#visitRows").innerHTML = rows.join("");
}

(function () {
  const src = document.getElementById("logo").src;
  ["icon", "apple-touch-icon"].forEach(rel => {
    const l = document.createElement("link"); l.rel = rel; l.href = src; document.head.appendChild(l);
  });
})();

renderStore();
renderMenu();
</script>
